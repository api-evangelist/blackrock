components:
  schemas:
    v1StudioRecipientScope:
      type: object
      title: studioRecipientScope describes the notification recipient
      properties:
        studioRecipientId:
          type: string
          title: "studio_recipient_id is the id of the targeted notification receiver.\n(-- api-linter: core::0124::required-reference=disabled\n    aip.dev/not-precedent: We need to do this because it is an opaque identifier. --)"
        studioRecipientType:
          title: studio_recipient_type is the type of the notification receiver
          $ref: '#/components/schemas/v1StudioRecipientType'
        studioRecipientAccessType:
          type: string
          title: studio_recipient_access_type is the access type of the notification receiver. Usually refers to group level notifications(member,owner,or a decode for perm level)
    v1StudioNotification:
      type: object
      title: StudioNotification describes a notification from Studio services
      properties:
        id:
          type: string
          title: id is the unique identifier for a notification
        studioNotificationEvent:
          title: studio_notification_event is the type of event that triggered the notification
          $ref: '#/components/schemas/v1StudioNotificationEvent'
        studioNotificationScope:
          title: studio_notification_scope is the scope of who this notification will be sent to matched by the subscription
          $ref: '#/components/schemas/v1StudioNotificationScope'
        sender:
          type: string
          title: sender is the source of the notification
        notificationSubject:
          type: string
          title: notification_subject is the title of the notification
        notificationMessage:
          type: string
          title: notification_message contains the body of the notification
        creationDateTime:
          type: string
          format: date-time
          title: creation_date_time is the time the notification was created
        notificationMetadata:
          type: object
          title: notification_metadata is a free-form payload that can contain any information about the specific notification to be displayed
        studioRecipientScopes:
          type: array
          title: array of all recipients of all types
          items:
            $ref: '#/components/schemas/v1StudioRecipientScope'
    v1StudioRecipientType:
      description: "- STUDIO_RECIPIENT_TYPE_UNSPECIFIED: Unspecified\n - STUDIO_RECIPIENT_TYPE_USER: User\n - STUDIO_RECIPIENT_TYPE_EMAIL: Email\n - STUDIO_RECIPIENT_TYPE_PROJECT: Project\n - STUDIO_RECIPIENT_TYPE_SPACE: Space\n - STUDIO_RECIPIENT_TYPE_PERM: PERMS"
      type: string
      title: StudioRecipientType is the type of the notification receiver
      default: STUDIO_RECIPIENT_TYPE_UNSPECIFIED
      enum:
      - STUDIO_RECIPIENT_TYPE_UNSPECIFIED
      - STUDIO_RECIPIENT_TYPE_USER
      - STUDIO_RECIPIENT_TYPE_EMAIL
      - STUDIO_RECIPIENT_TYPE_PROJECT
      - STUDIO_RECIPIENT_TYPE_SPACE
      - STUDIO_RECIPIENT_TYPE_PERM
    v1StudioEntityType:
      description: "- STUDIO_ENTITY_TYPE_UNSPECIFIED: Unspecified\n - STUDIO_ENTITY_TYPE_USER: User\n - STUDIO_ENTITY_TYPE_PROJECT: Project\n - STUDIO_ENTITY_TYPE_SPACE: Space"
      type: string
      title: StudioEntityType is the entity type of the notification receiver
      default: STUDIO_ENTITY_TYPE_UNSPECIFIED
      enum:
      - STUDIO_ENTITY_TYPE_UNSPECIFIED
      - STUDIO_ENTITY_TYPE_USER
      - STUDIO_ENTITY_TYPE_PROJECT
      - STUDIO_ENTITY_TYPE_SPACE
    v1StudioNotificationEvent:
      type: object
      title: StudioNotificationEvent contains the information about the event that triggers a Studio notification
      properties:
        studioNotificationEventType:
          title: studio_notification_event_type is the type of event that triggered the notification e.g. NOTIFICATION_TYPE_PROJECT
          $ref: '#/components/schemas/v1StudioNotificationEventType'
        eventName:
          type: string
          title: name is the name of the event specific to the type of notification e.g. project_user_added
    v1StudioNotificationEventType:
      description: "- STUDIO_NOTIFICATION_EVENT_TYPE_UNSPECIFIED: Unspecified\n - STUDIO_NOTIFICATION_EVENT_TYPE_ACM: Aladdin Credit Management\n - STUDIO_NOTIFICATION_EVENT_TYPE_COMPUTE: Studio Compute\n - STUDIO_NOTIFICATION_EVENT_TYPE_API: API Applications\n - STUDIO_NOTIFICATION_EVENT_TYPE_SPACE: Studio Space\n - STUDIO_NOTIFICATION_EVENT_TYPE_PROJECT: Studio Project"
      type: string
      title: StudioNotificationEventType is the type of Studio notification
      default: STUDIO_NOTIFICATION_EVENT_TYPE_UNSPECIFIED
      enum:
      - STUDIO_NOTIFICATION_EVENT_TYPE_UNSPECIFIED
      - STUDIO_NOTIFICATION_EVENT_TYPE_ACM
      - STUDIO_NOTIFICATION_EVENT_TYPE_COMPUTE
      - STUDIO_NOTIFICATION_EVENT_TYPE_API
      - STUDIO_NOTIFICATION_EVENT_TYPE_SPACE
      - STUDIO_NOTIFICATION_EVENT_TYPE_PROJECT
    v1StudioNotificationScope:
      type: object
      title: StudioNotificationScope describes the notification receiver
      properties:
        studioEntityType:
          title: studio_entity_type is the entity type of the notification receiver
          $ref: '#/components/schemas/v1StudioEntityType'
        studioEntityName:
          type: string
          title: studio_entity_name is the name of the targeted notification receiver
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      name: VND.com.blackrock.API-Key
      in: header
    ClientKeyHeader:
      type: apiKey
      name: X-API-Key
      in: header
    OAuth2AccessCode:
      type: oauth2
      flows:
        authorizationCode:
          scopes:
            offline_access: This keeps you signed in to the app, even when you are not using it.
            platform.studio.studio_notification.v1.StudioNotification: This grants access to all endpoints in the platform.studio.studio_notification.v1.StudioNotification API
          authorizationUrl: https://client.blackrock.com/api/oauth2/default/v1/authorize
          tokenUrl: https://client.blackrock.com/api/oauth2/default/v1/token
      description: This API uses OAuth 2.0 with the access code flow.
    OAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          scopes:
            offline_access: This keeps you signed in to the app, even when you are not using it.
            platform.studio.studio_notification.v1.StudioNotification: This grants access to all endpoints in the platform.studio.studio_notification.v1.StudioNotification API
          tokenUrl: https://client.blackrock.com/api/oauth2/default/v1/token
      description: This API uses OAuth 2.0 with the client credentials flow.
    basicAuth:
      type: http
      scheme: basic
