components:
  schemas:
    v1StudioSubscriptionsQuery:
      description: The query required to perform a filter studio subscription call.
      type: object
      properties:
        studioEntityType:
          title: Type of entity we are filtering subscription on
          $ref: '#/components/schemas/v1StudioEntityType'
        studioEntityName:
          type: string
          title: Name of entity we are filtering subscription on
        studioNotificationEventType:
          title: Type of event we are filtering subscription on
          $ref: '#/components/schemas/v1StudioNotificationEventType'
        studioNotificationEventName:
          type: string
          title: Name of the event we are filtering subscription on
        userId:
          type: string
          title: user id of the studio subscription
        dateRangeFilter:
          title: Range filter
          $ref: '#/components/schemas/v1RangeFilter'
    v1StudioSubscription:
      type: object
      title: StudioSubscription describes a subscription to a Studio notification
      properties:
        id:
          type: string
          title: id is the unique identifier of a subscription
        user:
          type: string
          title: user is the user that is subscribed to a notification
        studioNotificationEvent:
          title: studio_notification_event is the type of notification the user is subscribed to
          $ref: '#/components/schemas/v1StudioNotificationEvent'
        studioNotificationScope:
          title: studio_notification_scope is the scope of who this notification will be sent to matched by the subscription
          $ref: '#/components/schemas/v1StudioNotificationScope'
        studioNotificationAction:
          title: action is the type of method the user will receive the notification
          $ref: '#/components/schemas/v1StudioNotificationAction'
        email:
          type: string
          title: email is the email address of the user that has this subscription
        creationDateTime:
          type: string
          format: date-time
          title: creation_date_time is the time the subscription was created
    v1RangeFilter:
      type: object
      title: Range Filter for filter requests across apis
      properties:
        startDate:
          type: string
          format: date
          title: Start range
        endDate:
          type: string
          format: date
          title: End range
    v1FilterStudioSubscriptionsRequest:
      description: The request body of the filter studio subscriptions call.
      type: object
      properties:
        query:
          description: The query used to filter against studio subscriptions.
          $ref: '#/components/schemas/v1StudioSubscriptionsQuery'
        pageToken:
          description: The starting point of a query result.
          type: string
        pageSize:
          description: 'The maximum number of studio notifications to be returned per page of results. The maximum allowed page size is 1000.


            Default is 100 if empty or a number < 1 is specified.'
          type: integer
          format: int32
    v1FilterStudioSubscriptionsResponse:
      description: The response for filter studio subscriptions method.
      type: object
      required:
      - studioSubscriptions
      properties:
        studioSubscriptions:
          description: The studio subscription entities that match the specified respective filter request.
          type: array
          required:
          - studio_subscriptions
          items:
            $ref: '#/components/schemas/v1StudioSubscription'
        nextPageToken:
          description: A token to retrieve the next page of results.
          type: string
    v1StudioEntityType:
      description: "- STUDIO_ENTITY_TYPE_UNSPECIFIED: Unspecified\n - STUDIO_ENTITY_TYPE_USER: User\n - STUDIO_ENTITY_TYPE_PROJECT: Project\n - STUDIO_ENTITY_TYPE_SPACE: Space"
      type: string
      title: StudioEntityType is the entity type of the notification receiver
      default: STUDIO_ENTITY_TYPE_UNSPECIFIED
      enum:
      - STUDIO_ENTITY_TYPE_UNSPECIFIED
      - STUDIO_ENTITY_TYPE_USER
      - STUDIO_ENTITY_TYPE_PROJECT
      - STUDIO_ENTITY_TYPE_SPACE
    v1StudioNotificationEvent:
      type: object
      title: StudioNotificationEvent contains the information about the event that triggers a Studio notification
      properties:
        studioNotificationEventType:
          title: studio_notification_event_type is the type of event that triggered the notification e.g. NOTIFICATION_TYPE_PROJECT
          $ref: '#/components/schemas/v1StudioNotificationEventType'
        eventName:
          type: string
          title: name is the name of the event specific to the type of notification e.g. project_user_added
    v1StudioNotificationAction:
      description: "- STUDIO_NOTIFICATION_ACTION_UNSPECIFIED: Unspecified\n - STUDIO_NOTIFICATION_ACTION_SMTP: Email notification\n - STUDIO_NOTIFICATION_ACTION_PUSH: Studio UI push notification"
      type: string
      title: StudioNotificationAction describes the method in which the user will receive the notification
      default: STUDIO_NOTIFICATION_ACTION_UNSPECIFIED
      enum:
      - STUDIO_NOTIFICATION_ACTION_UNSPECIFIED
      - STUDIO_NOTIFICATION_ACTION_SMTP
      - STUDIO_NOTIFICATION_ACTION_PUSH
    v1StudioNotificationEventType:
      description: "- STUDIO_NOTIFICATION_EVENT_TYPE_UNSPECIFIED: Unspecified\n - STUDIO_NOTIFICATION_EVENT_TYPE_ACM: Aladdin Credit Management\n - STUDIO_NOTIFICATION_EVENT_TYPE_COMPUTE: Studio Compute\n - STUDIO_NOTIFICATION_EVENT_TYPE_API: API Applications\n - STUDIO_NOTIFICATION_EVENT_TYPE_SPACE: Studio Space\n - STUDIO_NOTIFICATION_EVENT_TYPE_PROJECT: Studio Project"
      type: string
      title: StudioNotificationEventType is the type of Studio notification
      default: STUDIO_NOTIFICATION_EVENT_TYPE_UNSPECIFIED
      enum:
      - STUDIO_NOTIFICATION_EVENT_TYPE_UNSPECIFIED
      - STUDIO_NOTIFICATION_EVENT_TYPE_ACM
      - STUDIO_NOTIFICATION_EVENT_TYPE_COMPUTE
      - STUDIO_NOTIFICATION_EVENT_TYPE_API
      - STUDIO_NOTIFICATION_EVENT_TYPE_SPACE
      - STUDIO_NOTIFICATION_EVENT_TYPE_PROJECT
    v1StudioNotificationScope:
      type: object
      title: StudioNotificationScope describes the notification receiver
      properties:
        studioEntityType:
          title: studio_entity_type is the entity type of the notification receiver
          $ref: '#/components/schemas/v1StudioEntityType'
        studioEntityName:
          type: string
          title: studio_entity_name is the name of the targeted notification receiver
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      name: VND.com.blackrock.API-Key
      in: header
    ClientKeyHeader:
      type: apiKey
      name: X-API-Key
      in: header
    OAuth2AccessCode:
      type: oauth2
      flows:
        authorizationCode:
          scopes:
            offline_access: This keeps you signed in to the app, even when you are not using it.
            platform.studio.studio_notification.v1.StudioSubscription: This grants access to all endpoints in the platform.studio.studio_notification.v1.StudioSubscription API
          authorizationUrl: https://client.blackrock.com/api/oauth2/default/v1/authorize
          tokenUrl: https://client.blackrock.com/api/oauth2/default/v1/token
      description: This API uses OAuth 2.0 with the access code flow.
    OAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          scopes:
            offline_access: This keeps you signed in to the app, even when you are not using it.
            platform.studio.studio_notification.v1.StudioSubscription: This grants access to all endpoints in the platform.studio.studio_notification.v1.StudioSubscription API
          tokenUrl: https://client.blackrock.com/api/oauth2/default/v1/token
      description: This API uses OAuth 2.0 with the client credentials flow.
    basicAuth:
      type: http
      scheme: basic
