                - message
                properties:
                  code:
                    description: A short mnemonic reference code for the error.
                    type: string
                    maxLength: 40
                  message:
                    description: A human readable description of the error.
                    type: string
      x-access-type: READ
      x-quota-limit: 5000
      tags:
      - AuthorizationUrl:generate
    servers:
    - url: /api/platform/infrastructure/token/v1/
components:
  schemas:
    v1AuthorizationUrl:
      type: object
      title: 'AuthorizationUrl is the Okta authorization URL for a user to consent

        to applications being able to access third-party services'
      properties:
        authorizationUrl:
          type: string
          title: authorization_url is the authorization redirect URL
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      name: VND.com.blackrock.API-Key
      in: header
    ClientKeyHeader:
      type: apiKey
      name: X-API-Key
      in: header
    OAuth2AccessCode:
      type: oauth2
      flows:
        authorizationCode:
          scopes:
            offline_access: This keeps you signed in to the app, even when you are not using it.
            platform.infrastructure.token.v1.Token:read: non-sensitive read
          authorizationUrl: https://client.blackrock.com/api/oauth2/default/v1/authorize
          tokenUrl: https://client.blackrock.com/api/oauth2/default/v1/token
      description: This API uses OAuth 2.0 with the access code flow.
    OAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          scopes:
            offline_access: This keeps you signed in to the app, even when you are not using it.
            platform.infrastructure.token.v1.Token:read: non-sensitive read
          tokenUrl: https://client.blackrock.com/api/oauth2/default/v1/token
      description: This API uses OAuth 2.0 with the client credentials flow.
    basicAuth:
      type: http
      scheme: basic
x-refined-from:
- blackrock-token-swagger.json
- blackrock-token-openapi.yml
x-access-level: Internal
