openapi: 3.2.0
info:
  title: Blackrock Authorization Url:generate API
  version: 1.0.0
  x-aladdin-api-id: agraph.platform.infrastructure.token.TokenAPI
  x-aladdin-api-stability: beta
  x-aladdin-spec-id: agraph.platform.infrastructure.token.v1.TokenAPI
  description: 'Operations tagged AuthorizationUrl:generate across 2 of this provider''s published API definitions: blackrock-token-swagger.json, blackrock-token-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /api/platform/infrastructure/token/v1/
security:
- APIKeyHeader: []
  OAuth2AccessCode:
  - offline_access
  - platform.infrastructure.token.v1.Token:read
- APIKeyHeader: []
  OAuth2ClientCredentials:
  - offline_access
  - platform.infrastructure.token.v1.Token:read
- APIKeyHeader: []
  ClientKeyHeader: []
- APIKeyHeader: []
  basicAuth: []
tags:
- name: AuthorizationUrl:generate
paths:
  /authorizationUrl:generate:
    get:
      security:
      - APIKeyHeader: []
        OAuth2AccessCode:
        - platform.infrastructure.token.v1.Token:read
      - APIKeyHeader: []
        OAuth2ClientCredentials:
        - platform.infrastructure.token.v1.Token:read
      - APIKeyHeader: []
        ClientKeyHeader: []
      - APIKeyHeader: []
        basicAuth: []
      description: 'AuthorizationUrl is the Okta authorization URL for a user to consent

        to applications being able to access third-party services.

        Follow the AuthorizationUrl in the response to authenticate, providing

        consent to the application. The resultant access+refresh token will then

        be available via GenerateToken.'
      summary: GenerateAuthorizationUrl retrieves an Okta authorization URL
      operationId: TokenAPI_GenerateAuthorizationUrl
      parameters:
      - description: A unique identifier for this request.
        name: VND.com.blackrock.Request-ID
        in: header
        required: true
        schema:
          type: string
          format: UUID
      - description: Timestamp assigned to this request at origin, in "HTTP-date" format as defined by RFC 7231.
        name: VND.com.blackrock.Origin-Timestamp
        in: header
        required: true
        schema:
          type: string
          format: date-time
      - description: application_name is an OAuth2 *application* client.
        name: applicationName
        in: query
        required: true
        schema:
          type: string
      - description: redirect_uri is the URI to be redirected to after authorization is complete.
        name: redirectUri
        in: query
        required: true
        schema:
          type: string
      - description: user is the user of the requestor of a token. user parameter field is temporary until bms header modifier is added to go
        name: user
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1AuthorizationUrl'
        '400':
          description: Aladdin® will not process the request due to an apparent client error.
          headers:
            VND.com.blackrock.Request-ID:
              description: The unique identifier assigned by the client to the request that originated this response.
              schema:
                type: string
                format: UUID
            VND.com.blackrock.Response-ID:
              description: A Unique Identifier for this response.
              schema:
                type: string
                format: UUID
            VND.com.blackrock.Response-Timestamp:
              description: Timestamp assigned to this response, in "HTTP-date" format as defined by RFC 7231.
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                description: Defines an error that occurred.
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    description: A short mnemonic reference code for the error.
                    type: string
                    maxLength: 40
                  message:
                    description: A human readable description of the error.
                    type: string
        '401':
          description: Aladdin® will not process the request as the necessary credentials were not provided or were invalid.
          headers:
            VND.com.blackrock.Request-ID:
              description: The unique identifier assigned by the client to the request that originated this response.
              schema:
                type: string
                format: UUID
            VND.com.blackrock.Response-ID:
              description: A Unique Identifier for this response.
              schema:
                type: string
                format: UUID
            VND.com.blackrock.Response-Timestamp:
              description: Timestamp assigned to this response, in "HTTP-date" format as defined by RFC 7231.
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                description: Defines an error that occurred.
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    description: A short mnemonic reference code for the error.
                    type: string
                    maxLength: 40
                  message:
                    description: A human readable description of the error.
                    type: string
        '403':
          description: Aladdin® understood the request but is refusing to authorize it.
          headers:
            VND.com.blackrock.Request-ID:
              description: The unique identifier assigned by the client to the request that originated this response.
              schema:
                type: string
                format: UUID
            VND.com.blackrock.Response-ID:
              description: A Unique Identifier for this response.
              schema:
                type: string
                format: UUID
            VND.com.blackrock.Response-Timestamp:
              description: Timestamp assigned to this response, in "HTTP-date" format as defined by RFC 7231.
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                description: Defines an error that occurred.
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    description: A short mnemonic reference code for the error.
                    type: string
                    maxLength: 40
                  message:
                    description: A human readable description of the error.
                    type: string
        '404':
          description: Aladdin® did not find the resource requested or is unwilling to disclose if it exists. Could indicate a defect in the client program or data which is no longer accessible.
          headers:
            VND.com.blackrock.Request-ID:
              description: The unique identifier assigned by the client to the request that originated this response.
              schema:
                type: string
                format: UUID
            VND.com.blackrock.Response-ID:
              description: A Unique Identifier for this response.
              schema:
                type: string
                format: UUID
            VND.com.blackrock.Response-Timestamp:
              description: Timestamp assigned to this response, in "HTTP-date" format as defined by RFC 7231.
              schema:
                type: string
                format: date-time
          content:
